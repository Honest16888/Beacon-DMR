plugins {
    id 'com.android.application'
}

android {
    namespace 'nrl.pulse.fmo'
    compileSdk 34

    defaultConfig {
        applicationId "nrl.pulse.fmo"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 保留 libnrlguard.so / libopendmr.so 的符号
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libnrlguard.so', '**/libopendmr.so']
        }
    }
}

dependencies {
    // MQTT v5（与 OpenRF 同一套）
    implementation 'org.eclipse.paho:org.eclipse.paho.mqttv5.client:1.2.5'
    // TLS / 证书链（与 OpenRF 同一套）
    implementation 'org.bouncycastle:bcprov-jdk18on:1.77'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.77'
    // HTTP
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // 序列化（BeaconConfig / BroadcastConfig 用）
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
